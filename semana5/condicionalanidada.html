<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana5</title>
</head>
<body>
    <style type="text/css">
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 16px 48px;
            overflow-x: hidden;
            color: #f4f7ff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background:
                radial-gradient(ellipse at 12% 15%, rgb(0 221 220 / 22%), transparent 38%),
                radial-gradient(ellipse at 88% 30%, rgb(255 72 174 / 19%), transparent 35%),
                linear-gradient(145deg, #10152e, #192d50 55%, #241638);
            background-attachment: fixed;
        }

        h1,
        h2 {
            width: fit-content;
            max-width: 100%;
            margin: 18px auto;
            text-align: center;
        }

        h1 {
            color: #a9ffff;
            font-size: clamp(2rem, 7vw, 4rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 0 12px #00e5e5, 0 0 32px rgb(0 229 229 / 55%);
            animation: title-glow 3s ease-in-out infinite alternate;
        }

        h2 {
            padding: 10px 22px;
            border: 1px solid rgb(255 255 255 / 20%);
            border-radius: 999px;
            color: #fff;
            font-size: clamp(1.1rem, 4vw, 1.6rem);
            background: linear-gradient(100deg, rgb(0 205 210 / 30%), rgb(228 72 169 / 35%));
            box-shadow: 0 8px 28px rgb(0 0 0 / 25%);
        }

        img {
            display: block;
            width: min(380px, 90vw);
            height: min(380px, 90vw);
            margin: 24px auto;
            border: 3px solid rgb(255 255 255 / 75%);
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 14px 40px rgb(0 0 0 / 40%), 0 0 24px rgb(0 225 225 / 30%);
            animation: image-float 5s ease-in-out infinite;
            transition: transform 250ms ease, box-shadow 250ms ease;
        }

        img:hover {
            transform: scale(1.04) rotate(-1deg);
            box-shadow: 0 18px 48px rgb(0 0 0 / 50%), 0 0 32px rgb(255 72 174 / 55%);
        }

        audio {
            display: block;
            width: min(420px, 100%);
            margin: 20px auto;
            accent-color: #00d9d9;
            filter: drop-shadow(0 8px 14px rgb(0 0 0 / 30%));
        }

        /* Reproductores de música (Spotify y Apple Music) */
        iframe {
            display: block;
            width: min(420px, 100%) !important;   /* mismo ancho que la imagen, sin estirarse */
            max-width: 100% !important;
            margin: 24px auto;
            border: 0;
            border-radius: 16px !important;
            box-shadow: 0 12px 32px rgb(0 0 0 / 35%), 0 0 0 2px rgb(255 255 255 / 15%);
            transition: transform 250ms ease, box-shadow 250ms ease;
        }

        iframe:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgb(0 0 0 / 45%), 0 0 24px rgb(0 225 225 / 45%);
        }

        /* Todos los de Spotify con el mismo alto (versión compacta) */
        iframe[src*="spotify"] {
            height: 152px;
        }

        /* Apple Music necesita un poco más de alto */
        iframe[src*="apple"] {
            height: 175px;
        }

        @keyframes title-glow {
            from { text-shadow: 0 0 10px #00e5e5, 0 0 22px rgb(0 229 229 / 40%); }
            to { text-shadow: 0 0 16px #00e5e5, 0 0 38px rgb(255 72 174 / 65%); }
        }

        @keyframes image-float {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -7px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
    <h1>hololive</h1>

        //repaso de javascript aui es interacion con el usuario
        const nombre=prompt("Buenos dias estimado,¿Me podria decir tu nombre?");

             case "1":

                  document.write("<br>");

                  document.write('<iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/0mE3b2MvponUis96jKShob?utm_source=generator&si=a4464643d1ac486a" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>');

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renzo Fabrizio Arias Romero</title>
    <style>
        body{
            background-size: cover;
            background-image: url(https://images.unsplash.com/photo-1521587760476-6c12a4b040da?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bGlicm9zJTIwZGUlMjBsYSUyMGJpYmxpb3RlY2F8ZW58MHx8MHx8fDA%3D);
            text-align: center;
        }
        h1{
            color: lightblue;
        }
        h2{
            color: #fff;
        }
        .imagen{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        img{
            width: 280px;
            height: 420px;
            object-fit: cover;
            border-radius: 12px;
            padding: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 250ms ease, box-shadow 250ms ease;
            cursor: pointer; /* Hace que el mouse cambie a manito al pasar sobre las imágenes */
        }
        img:hover {
            transform: scale(1.04) rotate(-3deg);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
        }
        .lista {
            text-align: left;
            width: 300px;
            margin: 20px auto;
        }
        ul {
            list-style: none;
            padding-left: 16px;
            color: lightskyblue;
            display: flex;
            flex-direction: row;
            background-color: rgb(237, 237, 237)
        }
        .botton{
            margin-bottom: 4px;
            padding: 4px;
        }
        button {
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .resultado {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 1. Envolvemos TODO el contenido inicial dentro de este contenedor -->
    <div id="contenido-principal">
        <br><br>
        <div class="botton">
            <button onclick="Dar_la_bienvenida()">Bienvenida</button>
        </div>
        <div class="titulo">
           <h1>Libros</h1>
        </div>
        <div class="padre">
            <div class="hijo">
                <div class="imagen">
                    <!-- Ahora cada imagen es directamente clickeable gracias a onclick -->
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxOkdB1-cbW-fYaMosAZXjDWdtEo6xarDL4jdWkVb468Oo5ngUpAE7cfU&s=10" alt="Libro 1" onclick="mostrarLibro(1)">
                    <img src="https://storage-aws-production.publica.la/bookwire-direct-sales/issues/2024/08/WKFeIfUjo7XSNFfp/e5a03a6c-63fc-4009-afc1-4dcb54f94d37_cover.jpg" alt="Libro 2" onclick="mostrarLibro(2)">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRDF2xhtrLdlQG4uXqXVk7XsluGRGyL7j_DwjLWg8oDA&s" alt="Libro 3" onclick="mostrarLibro(3)">
                </div>
            </div>
        </div>

        <div class="lista">
            <ul>
                <li>1. Cien años de soledad</li>
                <li>2. Divina comedia</li>
                <li>3. Los miserables</li>
            </ul>
        </div>
        <div class="botton">
            <button onclick="Tu_libro_favorito()">Escoger libros</button>
        </div>
    </div>
    <!-- Fin del contenido principal -->

    <!-- 2. Aquí aparecerá únicamente el resultado -->
    <div class="resultado" id="resultado"></div>

    <script>
        let nombre = "";

        function Dar_la_bienvenida(){
            nombre = prompt("¿Cual es tu nombre?");
            alert("Muy buenos dias " + nombre);
        };

        // Función auxiliar si se usa el botón de prompt clásico
        function Tu_libro_favorito(){
            if (!nombre) {
                nombre = prompt("¿Cual es tu nombre?");
            }

            let libro_favorito = prompt("¿Cual es tu libro favorito? 1) cien años de soledad 2) Divina comedia 3) los miserables");
            
            if (libro_favorito >= "1" && libro_favorito <= "3") {
                mostrarLibro(libro_favorito);
            } else {
                alert("Escoge dentro de las opciones válidas (1, 2 o 3)");
            }
        }

        // FUNCIÓN CENTRALIZADA PARA MOSTRAR EL LIBRO (Sirve tanto para las imágenes como para el prompt)
        function mostrarLibro(libro_favorito) {

            // Ocultamos todo el contenido inicial
            document.getElementById("contenido-principal").style.display = "none";

            let contenedorResultado = document.getElementById("resultado");
            contenedorResultado.innerHTML = ""; // Limpia resultados previos

            switch (String(libro_favorito)) {
                case "1":
                    
                    contenedorResultado.innerHTML = `
                        <button onclick="volver()">Volver</button>
                        <br><br>
                        <h1>Cien años de soledad</h1>
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxOkdB1-cbW-fYaMosAZXjDWdtEo6xarDL4jdWkVb468Oo5ngUpAE7cfU&s=10" alt="Libro 1" style="width:280px; height:420px; object-fit:cover; border-radius:12px;">
                        <br><br>
                    `;

                    const iframe1 = document.createElement('iframe');
                    iframe1.src = 'https://www.youtube.com/embed/DSOuSMqUVBk?si=XwsYBCl50h3_SXsN&autoplay=1';
                    iframe1.width = "560";
                    iframe1.height = "315";
                    iframe1.frameBorder = '0';
                    iframe1.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                    iframe1.allowFullscreen = true;
                    
                    contenedorResultado.appendChild(iframe1);
                    break;

                case "2":
                    
                    contenedorResultado.innerHTML = `
                        <button onclick="volver()">Volver</button>
                        <br><br>
                        <h1>La Divina Comedia</h1>
                        <img src="https://storage-aws-production.publica.la/bookwire-direct-sales/issues/2024/08/WKFeIfUjo7XSNFfp/e5a03a6c-63fc-4009-afc1-4dcb54f94d37_cover.jpg" alt="Libro 2" style="width:280px; height:420px; object-fit:cover; border-radius:12px;">
                        <br><br>
                    `;

                    const iframe2 = document.createElement('iframe');
                    iframe2.src = 'https://www.youtube.com/embed/Z-adH8-WhSs?si=HhwU87BVMAeE27jp&autoplay=1'; 
                    iframe2.width = "560";
                    iframe2.height = "315";
                    iframe2.frameBorder = '0';
                    iframe2.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                    iframe2.allowFullscreen = true;
                    
                    contenedorResultado.appendChild(iframe2);
                    break;

                case "3":
                    
                    contenedorResultado.innerHTML = `
                        <button onclick="volver()">Volver</button>
                        <br><br>
                        <h1>Los Miserables</h1>
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRDF2xhtrLdlQG4uXqXVk7XsluGRGyL7j_DwjLWg8oDA&s" alt="Libro 3" style="width:280px; height:420px; object-fit:cover; border-radius:12px;">
                        <br><br>
                    `;

                    const iframe3 = document.createElement('iframe');
                    iframe3.src = 'https://www.youtube.com/embed/66pyo4Yw0BE?si=Hq-tQYDbk3uCxF29&autoplay=1'; 
                    iframe3.width = "560";
                    iframe3.height = "315";
                    iframe3.frameBorder = '0';
                    iframe3.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                    iframe3.allowFullscreen = true;
                    
                    contenedorResultado.appendChild(iframe3);
                    break;
            }
        }

        // Función global para el botón volver
        function volver() {
            document.getElementById("contenido-principal").style.display = "block";
            document.getElementById("resultado").innerHTML = "";
        }
     </script>
</body>
</html>
